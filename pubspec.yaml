name: regex_ui
description: Live, animated rule checklist for Flutter text fields. Password and form validation with ready rules, strength bar, list or chip styles.
version: 1.0.0
homepage: https://monsware.com/regex-ui/
repository: https://github.com/msaadev/regex_ui
issue_tracker: https://github.com/msaadev/regex_ui/issues
screenshots:
  - description: Regex UI password rules
    path: screen_shots/regex_ui.gif
topics:
  - validation
  - password
  - form
  - regex
  - widget

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
